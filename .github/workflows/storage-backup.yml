name: Daily Supabase Storage Backup

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  backup-storage:
    runs-on: ubuntu-latest

    steps:
      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure Rclone for Supabase S3
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [supabase]
          type = s3
          provider = Other
          env_auth = false
          access_key_id = ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          secret_access_key = ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          region = ${{ secrets.SUPABASE_S3_REGION }}
          endpoint = ${{ secrets.SUPABASE_S3_ENDPOINT }}
          EOF

      - name: Sync Storage Buckets
        run: |
          mkdir -p ./storage_backup
          
          # Tải trực tiếp các file từ từng Bucket (kể cả Public Bucket)
          rclone copy supabase:benefit-attachments ./storage_backup/benefit-attachments --s3-no-check-bucket --verbose || true
          rclone copy supabase:meetings ./storage_backup/meetings --s3-no-check-bucket --verbose || true
          rclone copy supabase:attendance-files ./storage_backup/attendance-files --s3-no-check-bucket --verbose || true
          rclone copy supabase:clerical-documents ./storage_backup/clerical-documents --s3-no-check-bucket --verbose || true

      - name: Upload Storage Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-storage-backup
          path: ./storage_backup/
          retention-days: 7
